    // =========================================================================
    // 5. HELPER TO PARSE FIREBASE CONFIG INPUT
    // =========================================================================
    function parseFirebaseConfigInput(rawText) {
      if (!rawText || !rawText.trim()) return null;
      let cleaned = rawText.trim();
      const firstBrace = cleaned.indexOf("{");
      const lastBrace = cleaned.lastIndexOf("}");
      if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
        cleaned = cleaned.slice(firstBrace, lastBrace + 1);
      }
      try {
        const parsed = JSON.parse(cleaned);
        if (parsed && parsed.apiKey && parsed.projectId) return parsed;
      } catch (_) {}

      try {
        const jsonified = cleaned
          .replace(/\/\/.*$/gm, "")
          .replace(/\/\*[\s\S]*?\*\//g, "")
          .replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":')
          .replace(/'/g, '"')
          .replace(/,\s*}/g, "}");
        const parsed = JSON.parse(jsonified);
        if (parsed && parsed.apiKey && parsed.projectId) return parsed;
      } catch (_) {}

      return null;
    }

    // =========================================================================
    // 6. MAIN REACT COMPONENT (Open Seniority Order — No Passwords/PINs)
    // =========================================================================
    function App() {
      const getInitialLocalData = () => {
        try {
          const saved = localStorage.getItem(LOCAL_STATE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.residents) && parsed.residents.length > 0) {
              return parsed;
            }
          }
        } catch (_) {}
        return {
          residents: INITIAL_RESIDENTS,
          customRotations: []

      };

      // Core shared state
      const [residents, setResidents] = useState(initialData.residents);
      const [customRotations, setCustomRotations] = useState(initialData.customRotations || []);

      // Firebase connection state
      const [fbConfig, setFbConfig] = useState(() => {
        if (HARDCODED_FIREBASE_CONFIG) return HARDCODED_FIREBASE_CONFIG;
        try {
          const savedCfg = localStorage.getItem(LOCAL_FB_CONFIG_KEY);
          return savedCfg ? JSON.parse(savedCfg) : null;
        } catch (_) {
          return null;
        }
      });
      const [fbStatus, setFbStatus] = useState("disconnected");
      const [fbErrorMsg, setFbErrorMsg] = useState("");
      const dbRef = useRef(null);

      // UI Navigation & Filters
      const [activeTab, setActiveTab] = useState("calendar");
      const [selectedMonth, setSelectedMonth] = useState("ALL");

      // Booking Confirmation Modal State (No PIN required)
      const [bookingModal, setBookingModal] = useState(null); // { week, isThirdSlot }

      // Firebase Config Modal State
      const [showFbModal, setShowFbModal] = useState(false);
      const [fbConfigText, setFbConfigText] = useState("");
      const [fbModalError, setFbModalError] = useState("");

      // Custom rotation input
      const [newRotationInput, setNewRotationInput] = useState("");

      // Reset confirmation modal
      const [showResetConfirm, setShowResetConfirm] = useState(false);

      // Toast & Copy state
      const [toast, setToast] = useState(null);
      const [copied, setCopied] = useState(false);

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // =======================================================================
      // FIREBASE REALTIME CONNECTION & LISTENER
      // =======================================================================
      useEffect(() => {
        let unsubscribe = null;
        let cancelled = false;

        const connectFirestore = async () => {
          if (!fbConfig) {
            setFbStatus("disconnected");
            dbRef.current = null;
            return;
          }
          if (!window.FirebaseBridge) {
            return;
          }

          setFbStatus("connecting");
          setFbErrorMsg("");

          try {
            const { initializeApp, getApps, deleteApp, getFirestore, doc, onSnapshot, getDoc, setDoc } =
              window.FirebaseBridge;

            const existingApps = getApps();
            for (const app of existingApps) {
              await deleteApp(app);
            }

            const app = initializeApp(fbConfig);
            const db = getFirestore(app);
            dbRef.current = db;

            const scheduleDocRef = doc(db, FIRESTORE_DOC_PATH[0], FIRESTORE_DOC_PATH[1]);

            const snap = await getDoc(scheduleDocRef);
            if (!snap.exists()) {
              await setDoc(scheduleDocRef, {
                residents,
                customRotations,
                updatedAt: new Date().toISOString()
              });
            }

            unsubscribe = onSnapshot(
              scheduleDocRef,
              (docSnap) => {
                if (cancelled) return;
                setFbStatus("connected");
                if (docSnap.exists()) {
                  const data = docSnap.data();
                  if (Array.isArray(data.residents) && data.residents.length > 0) {
                    setResidents(data.residents);
                  }
                  if (Array.isArray(data.customRotations)) {
                    setCustomRotations(data.customRotations);
                  }
                }
              },
              (err) => {
                if (cancelled) return;
                console.error("Firestore onSnapshot error:", err);
                setFbStatus("error");
                setFbErrorMsg(err.message || "Firestore bağlantı hatası.");
              }
            );
          } catch (err) {
            if (cancelled) return;
            console.error("Firebase init error:", err);
            setFbStatus("error");
            setFbErrorMsg(err.message || "Firebase yapılandırması geçersiz.");
          }
        };

        connectFirestore();
        const handleBridgeReady = () => connectFirestore();
        window.addEventListener("firebase-bridge-ready", handleBridgeReady);

        return () => {
          cancelled = true;
          window.removeEventListener("firebase-bridge-ready", handleBridgeReady);
          if (unsubscribe) unsubscribe();
        };
      }, [fbConfig]);

      // Persist state locally + push to Firestore
      const persistState = async (nextResidents, nextCustomRotations = customRotations) => {
        setResidents(nextResidents);
        setCustomRotations(nextCustomRotations);

        try {
          localStorage.setItem(
            LOCAL_STATE_KEY,
            JSON.stringify({
              residents: nextResidents,
              customRotations: nextCustomRotations
            })
          );
        } catch (_) {}

        if (dbRef.current && window.FirebaseBridge && fbStatus === "connected") {
          try {
            const { doc, setDoc } = window.FirebaseBridge;
            const scheduleDocRef = doc(dbRef.current, FIRESTORE_DOC_PATH[0], FIRESTORE_DOC_PATH[1]);
            await setDoc(scheduleDocRef, {
              residents: nextResidents,
              customRotations: nextCustomRotations,
              updatedAt: new Date().toISOString()
            });
          } catch (err) {
            console.error("Failed to sync to Firestore:", err);
            showToast("Bulut kaydı sırasında hata oluştu: " + err.message, "error");
          }
        }
      };

      // =======================================================================
      // COMPUTED VALUES & SCHEDULING RULES
      // =======================================================================
      const allRotations = useMemo(() => {
        return Array.from(new Set([...DEFAULT_ROTATIONS, ...customRotations]));
      }, [customRotations]);

      // Strictly follows seniority order (top to bottom)
      const currentChooser = useMemo(() => {
        const nextRegular = residents.find((r) => !r.bookedWeekId && !r.skipped);
        if (nextRegular) return nextRegular;
        return residents.find((r) => !r.bookedWeekId) || null;
      }, [residents]);

      const currentChooserRank = useMemo(() => {
        if (!currentChooser) return null;
        return residents.findIndex((r) => r.id === currentChooser.id) + 1;
      }, [residents, currentChooser]);

      const bookedCount = useMemo(() => residents.filter((r) => r.bookedWeekId).length, [residents]);
      const remainingCount = residents.length - bookedCount;

      const monthsList = useMemo(() => {
        const list = [];
        LEAVE_WEEKS.forEach((w) => {
          if (!list.includes(w.month)) list.push(w.month);
        });
        return list;
      }, []);

      const getWeekBookings = (weekId) => {
        return residents.filter((r) => r.bookedWeekId === weekId);
      };

      const conflictWarnings = useMemo(() => {
        const list = [];
        LEAVE_WEEKS.forEach((w) => {
          const booked = getWeekBookings(w.id);
          const seen = {};
          booked.forEach((b) => {
            const rot = (b.rotation || "").trim();
            if (!rot) return;
            if (seen[rot]) {
              list.push({ weekLabel: w.label, rotation: rot, names: `${seen[rot]} & ${b.name}` });
            } else {
              seen[rot] = b.name;
            }
          });
        });
        return list;
      }, [residents]);

      // Evaluate week eligibility for `currentChooser`
      const evaluateWeek = (week) => {
        const bookings = getWeekBookings(week.id);
        const others = currentChooser ? bookings.filter((b) => b.id !== currentChooser.id) : bookings;
        const count = others.length;

        if (!currentChooser) {
          return { canBook: false, status: "DONE", reason: "Tüm asistanların seçimi tamamlandı." };
        }

        if (currentChooser.bookedWeekId === week.id) {
          return { canBook: false, status: "OWN", reason: "Mevcut seçiminiz bu hafta." };
        }

        // Same-rotation rule (empty rotation does NOT conflict)
        const chooserRot = (currentChooser.rotation || "").trim().toLowerCase();
        if (chooserRot !== "") {
          const sameRotPerson = others.find(
            (b) => (b.rotation || "").trim().toLowerCase() === chooserRot
          );
          if (sameRotPerson) {
            return {
              canBook: false,
              status: "ROTATION_LOCKED",
              conflictPerson: sameRotPerson,
              reason: `Aynı Rotasyon Dolu (${sameRotPerson.rotation}: ${sameRotPerson.name})`
            };
          }
        }

        // Capacity rule: max 2 preferred, 3rd optional/tolerated
        if (count >= 3) {
          return { canBook: false, status: "FULL_3", reason: "Dolu - Maks 3" };
        }

        if (count === 2) {
          return {
            canBook: true,
            isThirdSlot: true,
            status: "THIRD_OPTIONAL",
            reason: "2 Kişi Dolu - 3. Kişi Opsiyonel"
          };
        }

        return {
          canBook: true,
          isThirdSlot: false,
          status: "OPEN",
          reason: `Müsait (${count}/2)`
        };
      };

      // =======================================================================
      // HANDLERS: DIRECT BOOKING, CANCEL, REORDER, ROTATIONS
      // =======================================================================
      const handleWeekCardClick = (week) => {
        if (!currentChooser) return;
        const evalRes = evaluateWeek(week);
        if (!evalRes.canBook) {
          showToast(evalRes.reason, "error");
          return;
        }
        setBookingModal({
          week,
          isThirdSlot: Boolean(evalRes.isThirdSlot)
        });
      };

      const handleConfirmBooking = async () => {
        if (!bookingModal || !currentChooser) return;

        const nextResidents = residents.map((r) =>
          r.id === currentChooser.id
            ? { ...r, bookedWeekId: bookingModal.week.id, skipped: false }
            : r
        );

        await persistState(nextResidents);
        showToast(`${currentChooser.name} için "${bookingModal.week.label}" onaylandı!`, "success");
        setBookingModal(null);
      };

      const handleCancelBooking = async (residentId) => {
        const target = residents.find((r) => r.id === residentId);
        if (!target) return;
        const nextResidents = residents.map((r) =>
          r.id === residentId ? { ...r, bookedWeekId: null } : r
        );
        await persistState(nextResidents);
        showToast(`${target.name} izin kaydı iptal edildi.`, "info");
      };

      const handleToggleSkip = async (residentId) => {
        const target = residents.find((r) => r.id === residentId);
        if (!target) return;
        const nextResidents = residents.map((r) =>
          r.id === residentId ? { ...r, skipped: !r.skipped } : r
        );
        await persistState(nextResidents);
        showToast(
          target.skipped
            ? `${target.name} tekrar aktif sıraya alındı.`
            : `${target.name} sırası geçici olarak atlandı.`,
          "info"
        );
      };

      const handleMoveSeniority = async (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= residents.length) return;
        const copy = [...residents];
        const [moved] = copy.splice(index, 1);
        copy.splice(targetIndex, 0, moved);
        await persistState(copy);
        showToast(`${moved.name} kıdem sırası #${targetIndex + 1} yapıldı.`, "info");
      };

      const handleJumpSeniority = async (fromIndex, toIndex) => {
        if (fromIndex === toIndex || toIndex < 0 || toIndex >= residents.length) return;
        const copy = [...residents];
        const [moved] = copy.splice(fromIndex, 1);
        copy.splice(toIndex, 0, moved);
        await persistState(copy);
        showToast(`${moved.name} kıdem sırası #${toIndex + 1} yapıldı.`, "info");
      };

      const handleChangeRotation = async (residentId, newRot) => {
        const nextResidents = residents.map((r) =>
          r.id === residentId ? { ...r, rotation: newRot } : r
        );
        await persistState(nextResidents);
        showToast("Rotasyon güncellendi.", "success");
      };

      const handleAddCustomRotation = async (e) => {
        e.preventDefault();
        const trimmed = newRotationInput.trim();
        if (!trimmed) return;
        if (!allRotations.some((r) => r.toLowerCase() === trimmed.toLowerCase())) {
          const nextCustom = [...customRotations, trimmed];
          await persistState(residents, nextCustom);
          showToast(`"${trimmed}" rotasyon listesine eklendi.`, "success");
        }
        setNewRotationInput("");
      };

      const handleResetAll = async () => {
        await persistState(INITIAL_RESIDENTS, []);
        setShowResetConfirm(false);
        showToast("Tüm liste varsayılan kıdem ve rotasyonlara sıfırlandı.", "info");
      };

      // =======================================================================
      // FIREBASE CONFIG MODAL ACTIONS
      // =======================================================================
      const handleSaveFirebaseConfig = (e) => {
        e.preventDefault();
        const parsed = parseFirebaseConfigInput(fbConfigText);
        if (!parsed) {
          setFbModalError(
            "Geçerli bir Firebase yapılandırması bulunamadı. Firebase Console > Project Settings içindeki firebaseConfig nesnesini yapıştırın."
          );
          return;
        }
        try {
          localStorage.setItem(LOCAL_FB_CONFIG_KEY, JSON.stringify(parsed));
        } catch (_) {}
        setFbConfig(parsed);
        setShowFbModal(false);
        setFbModalError("");
        showToast("Firebase yapılandırması kaydedildi, bağlanılıyor...", "info");
      };

      const handleDisconnectFirebase = () => {
        try {
          localStorage.removeItem(LOCAL_FB_CONFIG_KEY);
        } catch (_) {}
        setFbConfig(null);
        setFbStatus("disconnected");
        setShowFbModal(false);
        showToast("Yerel Önizleme Moduna geçildi.", "info");
      };

      // =======================================================================
      // EXPORT: WHATSAPP SUMMARY & CSV
      // =======================================================================
      const handleCopyWhatsApp = () => {
        const lines = [
          "🏥 *DÜZCE ÜNİVERSİTESİ RADYOLOJİ - İZİN LİSTESİ (Kasım 2026 – Mayıs 2027)*",
          `📊 Durum: ${bookedCount}/${residents.length} Asistan Planlandı`,
          "----------------------------------------",
          "*KIDEM SIRASINA GÖRE LİSTE:*"
        ];

        residents.forEach((r, idx) => {
          const w = LEAVE_WEEKS.find((wk) => wk.id === r.bookedWeekId);
          const rotLabel = r.rotation ? `[${r.rotation}]` : "[Boş]";
          const statusLabel = w ? `✅ ${w.label}` : r.skipped ? "⏭️ Beklemede" : "⏳ Sıra Bekliyor";
          lines.push(`${idx + 1}. ${r.name} ${rotLabel} → ${statusLabel}`);
        });

        lines.push("----------------------------------------");
        lines.push("*HAFTALARA GÖRE DAĞILIM:*");
        LEAVE_WEEKS.forEach((w) => {
          const bList = getWeekBookings(w.id);
          if (bList.length > 0) {
            const names = bList.map((b) => `${b.name} (${b.rotation || "Boş"})`).join(", ");
            lines.push(`📅 *${w.label}*: ${names}`);
          }
        });

        lines.push("----------------------------------------");
        lines.push("_Designed by Halit_");

        const text = lines.join("\n");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        setCopied(true);
        showToast("WhatsApp özeti panoya kopyalandı!", "success");
        setTimeout(() => setCopied(false), 2500);
      };

      const handleExportCSV = () => {
        const headers = [
          "Kıdem Sırası",
          "Adı Soyadı",
          "Rotasyon",
          "Durum",
          "Seçilen İzin Haftası",
          "Resmi Tatil Notu"
        ];
        const rows = residents.map((r, idx) => {
          const w = LEAVE_WEEKS.find((wk) => wk.id === r.bookedWeekId);
          const status = r.bookedWeekId ? "Onaylandı" : r.skipped ? "Beklemede" : "Sıra Bekliyor";
          return [
            idx + 1,
            `"${r.name}"`,
            `"${r.rotation || "Boş (Atanmamış)"}"`,
            `"${status}"`,
            `"${w ? w.label : "-"}"`,
            `"${w && w.holidays.length > 0 ? w.holidays.join(" / ") : "-"}"`
          ].join(",");
        });

        const csv = "\uFEFF" + [headers.join(","), ...rows].join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Duzce_Radyoloji_Izin_Listesi_2026_2027.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast("Excel / CSV dosyası indirildi.", "success");
      };

      // =======================================================================
      // RENDER
      // =======================================================================
      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-4 right-4 z-50 max-w-sm">
              <div
                className={`flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold text-white border ${
                  toast.type === "error"
                    ? "bg-rose-600 border-rose-700"
                    : toast.type === "info"
                    ? "bg-slate-800 border-slate-700"
                    : "bg-emerald-600 border-emerald-700"
                }`}
              >
                <Icon name={toast.type === "error" ? "alert" : "check"} className="w-4 h-4 shrink-0" />
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* =================================================================== */}
          {/* BOOKING CONFIRMATION MODAL (No PIN / Password)                      */}
          {/* =================================================================== */}
          {bookingModal && currentChooser && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-start gap-3">
                  <div
                    className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                      bookingModal.isThirdSlot
                        ? "bg-amber-100 text-amber-700"
                        : "bg-indigo-100 text-indigo-700"
                    }`}
                  >
                    <Icon name={bookingModal.isThirdSlot ? "alert" : "calendar"} className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-base font-bold text-slate-900">İzin Haftasını Onayla</h3>
                    <p className="text-xs text-slate-600 mt-0.5">
                      <strong>#{currentChooserRank} {currentChooser.name}</strong> (
                      {currentChooser.rotation || "Boş"}) için seçilen hafta:
                    </p>
                  </div>
                </div>

                <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
                  <div className="text-sm font-bold text-indigo-900">{bookingModal.week.label}</div>
                  <div className="text-xs text-slate-500">{bookingModal.week.sub}</div>
                  {bookingModal.week.holidays.length > 0 && (
                    <div className="pt-1 text-xs font-semibold text-purple-700">
                      ★ {bookingModal.week.holidays.join(" • ")}
                    </div>
                  )}
                </div>

                {bookingModal.isThirdSlot && (
                  <div className="p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900">
                    <strong>Dikkat (3. Kişi Toleransı):</strong> Bu haftada halihazırda 2 asistan
                    izinli. İstisnai durum kapsamında <strong>3. kişi</strong> olarak onaylamak
                    üzeresiniz.
                  </div>
                )}

                <div className="flex items-center justify-end gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setBookingModal(null)}
                    className="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200"
                  >
                    Vazgeç
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmBooking}
                    className={`px-4 py-2.5 rounded-xl text-xs font-semibold text-white shadow-sm ${
                      bookingModal.isThirdSlot
                        ? "bg-amber-600 hover:bg-amber-700"
                        : "bg-indigo-600 hover:bg-indigo-700"
                    }`}
                  >
                    İzni Kesinleştir
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =================================================================== */}
          {/* FIREBASE CONNECTION SETUP MODAL                                     */}
          {/* =================================================================== */}
          {showFbModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center shrink-0">
                    <Icon name="cloud" className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-base font-bold text-slate-900">
                      Firebase Canlı Senkronizasyon Ayarları
                    </h3>
                    <p className="text-xs text-slate-500">
                      Tüm asistanların kendi telefonundan canlı görmesi için Firestore bağlantısı
                    </p>
                  </div>
                </div>

                <form onSubmit={handleSaveFirebaseConfig} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      firebaseConfig JSON veya JS Kodunu Yapıştırın:
                    </label>
                    <textarea
                      rows={5}
                      value={fbConfigText}
                      onChange={(e) => {
                        setFbConfigText(e.target.value);
                        setFbModalError("");
                      }}
                      placeholder={`{\n  "apiKey": "AIzaSy...",\n  "authDomain": "radwinterleave.firebaseapp.com",\n  "projectId": "radwinterleave",\n  "appId": "1:315688376843:web:..."\n}`}
                      className="w-full p-3 text-xs font-mono rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    {fbModalError && (
                      <p className="text-xs font-semibold text-rose-600 mt-1">{fbModalError}</p>
                    )}
                  </div>

                  <div className="flex flex-wrap items-center justify-between gap-2 pt-1">
                    {fbConfig && !HARDCODED_FIREBASE_CONFIG ? (
                      <button
                        type="button"
                        onClick={handleDisconnectFirebase}
                        className="px-3 py-2 rounded-xl text-xs font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200"
                      >
                        Bağlantıyı Kes (Yerel Mod)
                      </button>
                    ) : (
                      <div />
                    )}

                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={() => setShowFbModal(false)}
                        className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200"
                      >
                        Kapat
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm"
                      >
                        Kaydet ve Bağlan
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* =================================================================== */}
          {/* RESET CONFIRMATION MODAL                                            */}
          {/* =================================================================== */}
          {showResetConfirm && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                <h3 className="text-base font-bold text-slate-900">Listeyi Sıfırla</h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Tüm asistanların seçtiği izin haftaları silinecek ve kıdem sırası ile rotasyonlar
                  başlangıç listesine dönecektir. Emin misiniz?
                </p>
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setShowResetConfirm(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700"
                  >
                    Vazgeç
                  </button>
                  <button
                    onClick={handleResetAll}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-rose-600 text-white hover:bg-rose-700"
                  >
                    Evet, Sıfırla
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =================================================================== */}
          {/* HEADER                                                              */}
          {/* =================================================================== */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-6xl mx-auto px-3.5 sm:px-6 py-3">
              <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-2.5">
                <div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <h1 className="text-base sm:text-lg font-extrabold text-slate-900 tracking-tight">
                      Düzce Üniversitesi Radyoloji - İzin Planlayıcı
                    </h1>
                    <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
                      Designed by Halit
                    </span>
                  </div>
                  <p className="text-[11px] sm:text-xs text-slate-500 mt-0.5">
                    Kasım 2026 – Mayıs 2027 • Kıdem sırasına göre 1 haftalık izin & rotasyon kontrolü
                  </p>
                </div>

                {/* Action Pills */}
                <div className="flex items-center flex-wrap gap-1.5 sm:gap-2">
                  {/* Firebase Status Pill */}
                  <button
                    onClick={() => {
                      setFbConfigText(fbConfig ? JSON.stringify(fbConfig, null, 2) : "");
                      setFbModalError("");
                      setShowFbModal(true);
                    }}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all ${
                      fbStatus === "connected"
                        ? "bg-emerald-50 text-emerald-800 border-emerald-200"
                        : fbStatus === "error"
                        ? "bg-rose-50 text-rose-800 border-rose-200"
                        : "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200"
                    }`}
                  >
                    <span
                      className={`w-2 h-2 rounded-full ${
                        fbStatus === "connected"
                          ? "bg-emerald-500 animate-pulse"
                          : fbStatus === "connecting"
                          ? "bg-amber-500 animate-ping"
                          : fbStatus === "error"
                          ? "bg-rose-500"
                          : "bg-slate-400"
                      }`}
                    />
                    <span>
                      {fbStatus === "connected"
                        ? "Firebase Canlı"
                        : fbStatus === "connecting"
                        ? "Bağlanıyor..."
                        : fbStatus === "error"
                        ? "Bağlantı Hatası"
                        : "Yerel Mod (Firebase Bağla)"}
                    </span>
                  </button>

                  {/* Copy WhatsApp Summary */}
                  <button
                    onClick={handleCopyWhatsApp}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-white text-slate-700 border border-slate-200 hover:bg-slate-50"
                  >
                    <Icon name={copied ? "check" : "copy"} className="w-3.5 h-3.5 text-emerald-600" />
                    <span>{copied ? "Kopyalandı" : "WhatsApp Özeti"}</span>
                  </button>

                  {/* Export CSV */}
                  <button
                    onClick={handleExportCSV}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white hover:bg-indigo-700"
                  >
                    <Icon name="download" className="w-3.5 h-3.5" />
                    <span className="hidden sm:inline">Excel / CSV</span>
                  </button>
                </div>
              </div>

              {fbStatus === "error" && (
                <div className="mt-2.5 px-3 py-2 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-800">
                  <strong>Firebase Hatası:</strong> {fbErrorMsg}
                </div>
              )}

              {conflictWarnings.length > 0 && (
                <div className="mt-2.5 px-3 py-2 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-800 flex items-center gap-2">
                  <Icon name="alert" className="w-4 h-4 text-rose-600 shrink-0" />
                  <div>
                    <strong>Rotasyon Çakışması:</strong>{" "}
                    {conflictWarnings.map((c, i) => (
                      <span key={i} className="mr-2">
                        {c.weekLabel} ({c.rotation}: {c.names})
                      </span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </header>

          {/* =================================================================== */}
          {/* STICKY CURRENT TURN BANNER (Strict Seniority Order)                 */}
          {/* =================================================================== */}
          <div className="bg-gradient-to-r from-indigo-700 via-indigo-600 to-blue-600 text-white shadow-md">
            <div className="max-w-6xl mx-auto px-3.5 sm:px-6 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
              {currentChooser ? (
                <>
                  <div className="flex items-center gap-3 min-w-0">
                    <div className="w-10 h-10 rounded-xl bg-white/15 border border-white/25 flex flex-col items-center justify-center shrink-0">
                      <span className="text-[9px] uppercase tracking-wider text-indigo-100">Sıra</span>
                      <span className="text-sm font-extrabold leading-none">
                        #{currentChooserRank}
                      </span>
                    </div>
                    <div className="min-w-0">
                      <div className="text-[11px] font-semibold uppercase tracking-wider text-indigo-100">
                        Şu An İzin Seçim Sırası (Kıdem Sırasına Göre)
                      </div>
                      <div className="text-base sm:text-lg font-extrabold truncate">
                        {currentChooser.name}
                      </div>
                      <div className="text-xs text-indigo-100 flex items-center gap-2 flex-wrap">
                        <span>
                          Rotasyon:{" "}
                          <strong className="text-white bg-white/15 px-1.5 py-0.5 rounded">
                            {currentChooser.rotation || "Boş (Atanmamış)"}
                          </strong>
                        </span>
                        <span>•</span>
                        <span>
                          Tamamlanan: <strong>{bookedCount}/{residents.length}</strong>
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* Quick Skip Turn button if someone hasn't picked yet */}
                  <div className="flex items-center gap-2 shrink-0">
                    <button
                      onClick={() => handleToggleSkip(currentChooser.id)}
                      className="px-3 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-semibold flex items-center gap-1"
                    >
                      <Icon name="skip" className="w-3.5 h-3.5" />
                      <span>{currentChooser.skipped ? "Sıraya Al" : "Sırayı Geçici Atla"}</span>
                    </button>
                  </div>
                </>
              ) : (
                <div className="flex items-center justify-between w-full py-1">
                  <div className="text-sm sm:text-base font-bold">
                    🎉 Tüm 21 asistanın izin haftası tamamlandı! ({bookedCount}/{residents.length})
                  </div>
                  <button
                    onClick={handleCopyWhatsApp}
                    className="px-3.5 py-1.5 rounded-xl bg-white text-indigo-700 text-xs font-bold shadow-xs"
                  >
                    Listeyi Kopyala
                  </button>
                </div>
              )}
            </div>
          </div>

          {/* =================================================================== */}
          {/* MAIN NAVIGATION TABS                                                */}
          {/* =================================================================== */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-3.5 sm:px-6 py-4 space-y-4">
            <div className="bg-white p-1.5 rounded-2xl border border-slate-200 shadow-xs grid grid-cols-3 gap-1.5">
              <button
                onClick={() => setActiveTab("calendar")}
                className={`flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${
                  activeTab === "calendar"
                    ? "bg-indigo-600 text-white shadow-xs"
                    : "text-slate-600 hover:bg-slate-100"
                }`}
              >
                <Icon name="calendar" className="w-4 h-4 shrink-0" />
                <span>Takvim & Seçim</span>
              </button>

              <button
                onClick={() => setActiveTab("queue")}
                className={`flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${
                  activeTab === "queue"
                    ? "bg-indigo-600 text-white shadow-xs"
                    : "text-slate-600 hover:bg-slate-100"
                }`}
              >
                <Icon name="users" className="w-4 h-4 shrink-0" />
                <span>Kıdem Sırası ({bookedCount}/{residents.length})</span>
              </button>

              <button
                onClick={() => setActiveTab("edit")}
                className={`flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-xl text-xs sm:text-sm font-bold transition-all ${
                  activeTab === "edit"
                    ? "bg-indigo-600 text-white shadow-xs"
                    : "text-slate-600 hover:bg-slate-100"
                }`}
              >
                <Icon name="sliders" className="w-4 h-4 shrink-0" />
                <span>Kıdem & Rotasyon Düzenle</span>
              </button>
            </div>

            {/* ================================================================= */}
            {/* TAB 1: CALENDAR & WEEK SELECTION                                  */}
            {/* ================================================================= */}
            {activeTab === "calendar" && (
              <div className="space-y-4">
                <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-xs space-y-3">
                  <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
                    <button
                      onClick={() => setSelectedMonth("ALL")}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 transition-all ${
                        selectedMonth === "ALL"
                          ? "bg-slate-900 text-white"
                          : "bg-slate-100 text-slate-700 hover:bg-slate-200"
                      }`}
                    >
                      Tümü (Kasım – Mayıs)
                    </button>
                    {monthsList.map((m) => (
                      <button
                        key={m}
                        onClick={() => setSelectedMonth(m)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 transition-all ${
                          selectedMonth === m
                            ? "bg-slate-900 text-white"
                            : "bg-slate-100 text-slate-700 hover:bg-slate-200"
                        }`}
                      >
                        {m}
                      </button>
                    ))}
                  </div>

                  <div className="flex flex-wrap items-center gap-x-4 gap-y-1.5 pt-2 border-t border-slate-100 text-[11px] font-medium text-slate-600">
                    <span className="inline-flex items-center gap-1.5">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-500" />
                      Müsait (0–1/2)
                    </span>
                    <span className="inline-flex items-center gap-1.5">
                      <span className="w-2.5 h-2.5 rounded-full bg-amber-500" />
                      2 Kişi Dolu (3. Kişi Opsiyonel)
                    </span>
                    <span className="inline-flex items-center gap-1.5">
                      <span className="w-2.5 h-2.5 rounded-full bg-rose-500" />
                      Kapalı (Aynı Rotasyon / Maks 3)
                    </span>
                    <span className="inline-flex items-center gap-1.5 text-purple-700 font-semibold">
                      <Icon name="sparkle" className="w-3.5 h-3.5 text-purple-600" />
                      Resmi Tatil Haftası
                    </span>
                  </div>
                </div>

                {monthsList
                  .filter((m) => selectedMonth === "ALL" || m === selectedMonth)
                  .map((monthName) => {
                    const monthWeeks = LEAVE_WEEKS.filter((w) => w.month === monthName);
                    return (
                      <div key={monthName} className="space-y-2.5">
                        <div className="flex items-center gap-2 px-1">
                          <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-700">
                            {monthName}
                          </h2>
                          <div className="h-px flex-1 bg-slate-200" />
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                          {monthWeeks.map((week) => {
                            const bookings = getWeekBookings(week.id);
                            const count = bookings.length;
                            const evalRes = evaluateWeek(week);
                            const hasHoliday = week.holidays.length > 0;

                            let cardClasses =
                              "bg-white border-slate-200 hover:border-indigo-400 hover:shadow-md cursor-pointer";
                            if (evalRes.status === "OWN") {
                              cardClasses =
                                "bg-indigo-50/70 border-indigo-500 ring-2 ring-indigo-500/20";
                            } else if (
                              evalRes.status === "ROTATION_LOCKED" ||
                              evalRes.status === "FULL_3"
                            ) {
                              cardClasses =
                                "bg-rose-50/50 border-rose-200 opacity-85 cursor-not-allowed";
                            } else if (evalRes.status === "THIRD_OPTIONAL") {
                              cardClasses =
                                "bg-amber-50/60 border-amber-300 hover:border-amber-500 hover:shadow-md cursor-pointer";
                            } else if (count === 1) {
                              cardClasses =
                                "bg-emerald-50/30 border-emerald-200 hover:border-emerald-500 hover:shadow-md cursor-pointer";
                            } else if (count === 0) {
                              cardClasses =
                                "bg-white border-slate-200 hover:border-emerald-500 hover:shadow-md cursor-pointer";
                            }

                            return (
                              <div
                                key={week.id}
                                onClick={() => handleWeekCardClick(week)}
                                className={`rounded-2xl border p-4 transition-all flex flex-col justify-between ${cardClasses}`}
                              >
                                <div>
                                  <div className="flex items-start justify-between gap-2">
                                    <div>
                                      <div className="text-sm font-extrabold text-slate-900">
                                        {week.label}
                                      </div>
                                      <div className="text-[11px] text-slate-500 mt-0.5">
                                        {week.sub}
                                      </div>
                                    </div>

                                    <span
                                      className={`text-[11px] font-bold px-2.5 py-1 rounded-full shrink-0 ${
                                        count >= 3
                                          ? "bg-rose-100 text-rose-800"
                                          : count === 2
                                          ? "bg-amber-100 text-amber-800"
                                          : "bg-emerald-100 text-emerald-800"
                                      }`}
                                    >
                                      {count >= 3
                                        ? "Dolu - Maks 3"
                                        : count === 2
                                        ? "2/2 (+1 Opsiyonel)"
                                        : `Müsait (${count}/2)`}
                                    </span>
                                  </div>

                                  {hasHoliday && (
                                    <div className="mt-2.5 p-2 rounded-xl bg-purple-50 border border-purple-200 text-purple-900 space-y-0.5">
                                      {week.holidays.map((h, idx) => (
                                        <div
                                          key={idx}
                                          className="text-[11px] font-semibold flex items-center gap-1.5"
                                        >
                                          <Icon
                                            name="sparkle"
                                            className="w-3.5 h-3.5 text-purple-600 shrink-0"
                                          />
                                          <span>{h}</span>
                                        </div>
                                      ))}
                                    </div>
                                  )}

                                  <div className="mt-3 space-y-1.5">
                                    {bookings.length === 0 ? (
                                      <div className="text-xs text-slate-400 italic py-1">
                                        Bu haftada henüz izinli asistan yok.
                                      </div>
                                    ) : (
                                      bookings.map((b) => {
                                        const rank =
                                          residents.findIndex((r) => r.id === b.id) + 1;
                                        const isSameRot =
                                          currentChooser &&
                                          b.id !== currentChooser.id &&
                                          (currentChooser.rotation || "").trim() !== "" &&
                                          (b.rotation || "").trim().toLowerCase() ===
                                            (currentChooser.rotation || "").trim().toLowerCase();

                                        return (
                                          <div
                                            key={b.id}
                                            className={`flex items-center justify-between text-xs px-2.5 py-1.5 rounded-xl border ${
                                              isSameRot
                                                ? "bg-rose-100 border-rose-300 text-rose-950 font-bold"
                                                : "bg-slate-50 border-slate-200 text-slate-800"
                                            }`}
                                          >
                                            <span className="truncate font-semibold">
                                              #{rank} {b.name}
                                            </span>
                                            <span
                                              className={`text-[10px] font-bold px-2 py-0.5 rounded-md border ml-2 shrink-0 ${getRotationBadge(
                                                b.rotation
                                              )}`}
                                            >
                                              {b.rotation || "Boş"}
                                            </span>
                                          </div>
                                        );
                                      })
                                    )}
                                  </div>
                                </div>

                                <div className="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between text-[11px] font-bold">
                                  {evalRes.status === "ROTATION_LOCKED" ? (
                                    <span className="text-rose-700 flex items-center gap-1">
                                      <Icon name="alert" className="w-3.5 h-3.5 shrink-0" />
                                      <span>
                                        Aynı Rotasyon Dolu ({evalRes.conflictPerson?.rotation})
                                      </span>
                                    </span>
                                  ) : evalRes.status === "FULL_3" ? (
                                    <span className="text-rose-700">Dolu - Maks 3</span>
                                  ) : evalRes.status === "THIRD_OPTIONAL" ? (
                                    <span className="text-amber-700">
                                      2 Kişi Dolu - 3. Kişi Opsiyonel (Seçmek için dokunun)
                                    </span>
                                  ) : evalRes.status === "OWN" ? (
                                    <span className="text-indigo-700">✓ Mevcut Seçiminiz</span>
                                  ) : evalRes.canBook ? (
                                    <span className="text-emerald-700">
                                      Seçmek için dokunun →
                                    </span>
                                  ) : (
                                    <span className="text-slate-500">{evalRes.reason}</span>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
              </div>
            )}

            {/* ================================================================= */}
            {/* TAB 2: SENIORITY QUEUE & OPEN CANCEL/SKIP CONTROLS                */}
            {/* ================================================================= */}
            {activeTab === "queue" && (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                <div className="p-4 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div>
                    <h2 className="text-sm font-extrabold text-slate-900">
                      Kıdem Sırası ve İzin Durumu (21 Asistan)
                    </h2>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Seçim en kıdemli asistandan (#1) başlayarak aşağı doğru ilerler. Hatalı seçimi
                      doğrudan iptal edebilirsiniz.
                    </p>
                  </div>
                  <div className="text-xs font-bold text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-200 self-start sm:self-auto">
                    Tamamlanan: {bookedCount} • Kalan: {remainingCount}
                  </div>
                </div>

                <div className="divide-y divide-slate-100">
                  {residents.map((r, idx) => {
                    const rank = idx + 1;
                    const isTurn = currentChooser?.id === r.id;
                    const bookedWeek = LEAVE_WEEKS.find((w) => w.id === r.bookedWeekId);

                    return (
                      <div
                        key={r.id}
                        className={`p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 ${
                          isTurn
                            ? "bg-indigo-50/90 border-l-4 border-l-indigo-600"
                            : bookedWeek
                            ? "bg-emerald-50/30"
                            : ""
                        }`}
                      >
                        <div className="flex items-center gap-3 min-w-0">
                          <span
                            className={`w-7 h-7 rounded-full text-xs font-extrabold flex items-center justify-center shrink-0 ${
                              isTurn
                                ? "bg-indigo-600 text-white"
                                : bookedWeek
                                ? "bg-emerald-600 text-white"
                                : r.skipped
                                ? "bg-amber-100 text-amber-800 border border-amber-300"
                                : "bg-slate-200 text-slate-700"
                            }`}
                          >
                            {rank}
                          </span>

                          <div className="min-w-0">
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className="text-sm font-bold text-slate-900">{r.name}</span>
                              <span
                                className={`text-[11px] font-bold px-2 py-0.5 rounded-md border ${getRotationBadge(
                                  r.rotation
                                )}`}
                              >
                                {r.rotation || "Boş (Atanmamış)"}
                              </span>
                              {isTurn && (
                                <span className="text-[10px] font-extrabold px-2 py-0.5 rounded bg-indigo-600 text-white">
                                  SIRA ONDA
                                </span>
                              )}
                            </div>

                            {bookedWeek ? (
                              <div className="text-xs font-bold text-emerald-700 mt-1">
                                ✅ {bookedWeek.label}
                                {bookedWeek.holidays.length > 0 && (
                                  <span className="text-purple-700 ml-1.5">
                                    (★ {bookedWeek.holidays[0]})
                                  </span>
                                )}
                              </div>
                            ) : r.skipped ? (
                              <div className="text-xs font-semibold text-amber-700 mt-0.5">
                                ⏭️ Sırası geçici olarak atlandı (Beklemede)
                              </div>
                            ) : (
                              <div className="text-xs text-slate-400 mt-0.5">
                                ⏳ Kıdem sırasını bekliyor
                              </div>
                            )}
                          </div>
                        </div>

                        {/* Open Controls: Cancel booking or Skip/Restore turn */}
                        <div className="flex items-center gap-2 self-end sm:self-center">
                          {!bookedWeek ? (
                            <button
                              onClick={() => handleToggleSkip(r.id)}
                              className="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-amber-100 text-amber-900 hover:bg-amber-200"
                            >
                              {r.skipped ? "Sıraya Al" : "Atla"}
                            </button>
                          ) : (
                            <button
                              onClick={() => handleCancelBooking(r.id)}
                              className="px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-rose-100 text-rose-800 hover:bg-rose-200 flex items-center gap-1"
                            >
                              <Icon name="trash" className="w-3.5 h-3.5" />
                              <span>İzni İptal Et</span>
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ================================================================= */}
            {/* TAB 3: OPEN SENIORITY & ROTATION EDITOR                           */}
            {/* ================================================================= */}
            {activeTab === "edit" && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-100">
                    <div>
                      <h2 className="text-sm font-extrabold text-slate-900">
                        Kıdem Sırası & Rotasyon Düzenle
                      </h2>
                      <p className="text-xs text-slate-500">
                        Kıdem sırasını veya rotasyonları değiştirdiğinizde tüm telefonlara anında yansır.
                      </p>
                    </div>
                    <button
                      onClick={() => setShowResetConfirm(true)}
                      className="px-3 py-2 rounded-xl text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100 flex items-center gap-1.5 self-start sm:self-auto"
                    >
                      <Icon name="reset" className="w-3.5 h-3.5" />
                      <span>Tüm Listeyi Sıfırla</span>
                    </button>
                  </div>

                  {/* Add Custom Rotation */}
                  <form onSubmit={handleAddCustomRotation} className="flex gap-2 max-w-md">
                    <input
                      type="text"
                      value={newRotationInput}
                      onChange={(e) => setNewRotationInput(e.target.value)}
                      placeholder="Yeni rotasyon adı (Örn: Meme, Pediatrik)..."
                      className="flex-1 text-xs px-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                    <button
                      type="submit"
                      className="px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white hover:bg-indigo-700 shrink-0"
                    >
                      + Rotasyon Ekle
                    </button>
                  </form>
                </div>

                {/* Editable Seniority & Rotation List */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-xs divide-y divide-slate-100 overflow-hidden">
                  {residents.map((r, idx) => (
                    <div
                      key={r.id}
                      className="p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50"
                    >
                      <div className="flex items-center gap-2.5">
                        <select
                          value={idx}
                          onChange={(e) => handleJumpSeniority(idx, Number(e.target.value))}
                          className="w-16 text-xs font-extrabold bg-slate-100 border border-slate-300 rounded-xl px-2 py-2 text-slate-900"
                        >
                          {residents.map((_, optIdx) => (
                            <option key={optIdx} value={optIdx}>
                              #{optIdx + 1}
                            </option>
                          ))}
                        </select>

                        <div className="flex flex-col">
                          <button
                            onClick={() => handleMoveSeniority(idx, -1)}
                            disabled={idx === 0}
                            className="p-1 text-slate-500 hover:text-indigo-600 disabled:opacity-25"
                            title="Yukarı Taşı"
                          >
                            <Icon name="up" className="w-4 h-4" />
                          </button>
                          <button
                            onClick={() => handleMoveSeniority(idx, 1)}
                            disabled={idx === residents.length - 1}
                            className="p-1 text-slate-500 hover:text-indigo-600 disabled:opacity-25"
                            title="Aşağı Taşı"
                          >
                            <Icon name="down" className="w-4 h-4" />
                          </button>
                        </div>

                        <div className="text-sm font-bold text-slate-900">{r.name}</div>
                      </div>

                      <div className="flex items-center gap-2 self-end sm:self-center">
                        <span className="text-xs font-medium text-slate-500">Rotasyon:</span>
                        <select
                          value={r.rotation}
                          onChange={(e) => handleChangeRotation(r.id, e.target.value)}
                          className={`text-xs font-bold px-3 py-2 rounded-xl border cursor-pointer ${getRotationBadge(
                            r.rotation
                          )}`}
                        >
                          <option value="" className="bg-white text-slate-700">
                            Boş (Atanmamış)
                          </option>
                          {allRotations.map((rot) => (
                            <option key={rot} value={rot} className="bg-white text-slate-900">
                              {rot}
                            </option>
                          ))}
                        </select>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 mt-8 py-4">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
              <div>
                Düzce Üniversitesi Tıp Fakültesi Radyoloji Anabilim Dalı • Asistan İzin Koordinasyon
                Sistemi
              </div>
              <div className="font-medium text-slate-400">
                Designed by <span className="text-slate-700 font-bold">Halit</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
